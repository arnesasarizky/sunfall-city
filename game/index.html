<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunfall City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d24; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status" role="status" aria-live="polite"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
